[package]
name = "tari_bulletproofs_plus"
version = "0.5.3"
authors = ["The Tari Development Community"]
edition = "2024"
license = "BSD-3-Clause"
description = "A smaller faster implementation of Bulletproofs"

[dependencies]
blake2 = { version = "0.10", default-features = false }
byteorder = { version = "1", default-features = false }
# Pinned exactly: the default caret requirement `5.0.0-pre.6` also permits the newer pre-release
# `5.0.0-rc.1`, which switches its `ff`/`group` backend from `rustcrypto-ff`/`rustcrypto-group` to the
# upstream `ff`/`group` crates and breaks the build (see issue #148). Pin until we migrate to the RC.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "group", "rand_core", "serde", "zeroize"] }
digest = { version = "0.10", default-features = false, features = ["alloc"] }
ff = { version = "0.14.0", default-features = false }
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"], optional = true }
itertools = { version = "0.12", default-features = false, features = ["use_alloc"] }
tari_merlin = { version = "4", default-features = false }
once_cell = { version = "1", default-features = false, features = ["alloc", "critical-section"] }
rand_core = { version = "0.10.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
sha3 = { version = "0.10", default-features = false }
thiserror-no-std = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
bincode = { version = "1", default-features = false }
criterion = { version = "0.5", default-features = false }
rand_chacha = { version = "0.10", default-features = false }

[features]
default = ["rand", "std"]
std = ["blake2/std", "byteorder/std", "digest/std", "ff/std", "itertools/use_std", "once_cell/std", "serde/std", "sha3/std", "tari_merlin/std", "zeroize/std"]
rand = ["dep:getrandom"]

[[bench]]
name = "range_proof"
harness = false

[[bench]]
name = "generators"
harness = false
